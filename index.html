<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CVGO PRO</title>
<style>body{margin:0;font-family:Arial;background:#f5f7fb;color:#111827}header{background:#111827;color:white;padding:18px 7%;font-weight:900;font-size:27px}.hero{max-width:500px;margin:70px auto;padding:0 20px;text-align:center}.card{background:white;border-radius:20px;padding:30px;box-shadow:0 10px 35px #10182812}.price{font-size:42px;font-weight:900}.card li{text-align:left;line-height:2;color:#475467}input{width:100%;padding:12px;border:1px solid #d9dee8;border-radius:9px;box-sizing:border-box;margin:8px 0 12px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#111827;color:white;font-weight:800;cursor:pointer}.status{font-size:13px;margin-top:14px}.ok{color:#087443}</style></head>
<body><header>CVGO</header><section class="hero"><h1>CVGO PRO</h1><p>Tu candidatura completa por un único pago.</p><div class="card"><div class="price">9,99 €</div><ul><li>CV optimizado</li><li>Adaptación a ofertas</li><li>Carta de presentación</li><li>Preparación de entrevista</li><li>Plantillas premium</li></ul><input id="email" type="email" placeholder="Tu email"><button onclick="pay()">Desbloquear PRO →</button><div id="s" class="status"></div></div></section>
<script>async function pay(){let s=document.getElementById("s"),email=document.getElementById("email").value.trim();s.textContent="Preparando pago...";try{let r=await fetch("/api/create-checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})}),j=await r.json();if(j.ok)location.href=j.url;else s.textContent="Stripe aún no está configurado."}catch(e){s.textContent="Error de conexión."}}
async function verify(){let id=new URLSearchParams(location.search).get("session_id");if(!id)return;let s=document.getElementById("s");s.textContent="Verificando pago...";try{let j=await (await fetch("/api/verify-session?session_id="+encodeURIComponent(id))).json();if(j.pro){s.className="status ok";s.textContent="✓ PRO activado para "+j.email}else s.textContent="Pago aún no verificado."}catch(e){s.textContent="No se pudo verificar."}}verify();</script></body></html>
