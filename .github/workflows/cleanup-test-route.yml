name: CVGO cleanup temporary test routes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary test routes and workflow
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app.py')
          text = p.read_text(encoding='utf-8')
          pattern = r"\n\n@app\.get\('/api/test-expire-trial'\)\ndef test_expire_trial\(\):.*?(?=\n\n@app\.post\('/api/logout'\))"
          cleaned, n = re.subn(pattern, '', text, flags=re.S)
          if n:
              p.write_text(cleaned, encoding='utf-8')
          Path('.github/workflows/cleanup-test-route.yml').unlink()
          print(f'Removed {n} temporary route block(s)')
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/cleanup-test-route.yml
          git commit -m "Remove temporary trial test routes" || exit 0
          git push
