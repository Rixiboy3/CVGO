name: CVGO cleanup temporary test code

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore clean app and remove test workflow
        shell: bash
        run: |
          git checkout 8917a8354fda2e32561e933ddfe6bc157574a0bd -- app.py
          rm -f .github/workflows/test-expire-trial.yml
          rm -f .github/workflows/restore-clean-app.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary trial test code"
          git push
