name: CVGO trial 3 days

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-trial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Change trial from 7 to 3 days
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          text = text.replace('TRIAL_DAYS = 7', 'TRIAL_DAYS = 3', 1)
          app.write_text(text, encoding='utf-8')

          for path in [Path('index.html'), Path('authfix.js'), Path('legal_api.py')]:
              if path.exists():
                  text = path.read_text(encoding='utf-8')
                  text = text.replace('7 DÍAS', '3 DÍAS')
                  text = text.replace('7 días', '3 días')
                  text = text.replace('7 Días', '3 Días')
                  path.write_text(text, encoding='utf-8')

          Path('.github/workflows/trial3.yml').unlink(missing_ok=True)

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py index.html authfix.js legal_api.py .github/workflows/trial3.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Reduce free trial to 3 days"
          git push
