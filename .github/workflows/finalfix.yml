name: Final fix
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update script versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('/analytics.js?v=2','/analytics.js?v=4',1)
          s=s.replace('/siteguard.js?v=1','/siteguard.js?v=2',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/finalfix.yml
          git commit -m "Aplicar corrección definitiva de cookies y sesión"
          git push
