name: Inject Analytics directly

on:
  push:
    branches: [main]

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject Analytics in Flask home
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '<script src="/ai.js?v=4"></script>'
          new = old + '<script id="cvgoAnalyticsScriptDirect" src="/analytics.js?v=2" defer></script>'
          if 'cvgoAnalyticsScriptDirect' not in s:
              if old not in s:
                  raise SystemExit('home injection anchor not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/analytics-direct.yml
          git commit -m "Cargar Analytics directamente en la landing"
          git push
