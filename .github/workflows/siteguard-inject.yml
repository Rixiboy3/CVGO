name: Inject siteguard

on:
  push:
    branches: [main]

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject siteguard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old='<script id="cvgoDashboardScript" src="/dashboard.js?v=13"></script>'
          new=old+'<script id="cvgoSiteGuardScript" src="/siteguard.js?v=1"></script>'
          if 'cvgoSiteGuardScript' not in s:
              if old not in s:
                  raise SystemExit('dashboard injection anchor not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/siteguard-inject.yml
          git commit -m "Cargar correcciones de cookies y sesión"
          git push
