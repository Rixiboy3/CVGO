name: Fix CV layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Corregir secciones y layout del CV'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cvpersist.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cvpersist.js')
          s = p.read_text(encoding='utf-8')
          old = "const designSection=[...cv.querySelectorAll('.section')].find(s=>/^6\\.\\s*Diseño/i.test(s.querySelector('h2')?.textContent||''));"
          new = "const designSection=[...cv.querySelectorAll('.section')].find(s=>/^(?:6|7)\\.\\s*Diseño/i.test(s.querySelector('h2')?.textContent||''));"
          if old not in s:
              raise SystemExit('design selector not found')
          s = s.replace(old, new, 1)
          old = "if(designSection)cv.insertBefore(section,designSection);else if(skillsSection)skillsSection.insertAdjacentElement('afterend',section);else cv.appendChild(section);"
          new = "if(designSection){cv.insertBefore(section,designSection);const h=designSection.querySelector('h2');if(h)h.textContent='7. Diseño'}else if(skillsSection){skillsSection.insertAdjacentElement('afterend',section)}else cv.appendChild(section);"
          if old not in s:
              raise SystemExit('section insertion not found')
          s = s.replace(old, new, 1)
          old = "if(!sec){sec=document.createElement('div');sec.id='cvLanguagesPreview';sec.className='cvsec';cv.appendChild(sec)}"
          new = "const host=cv.classList.contains('modern')?(cv.querySelector('.main')||cv):cv;if(!sec){sec=document.createElement('div');sec.id='cvLanguagesPreview';sec.className='cvsec';host.appendChild(sec)}else if(sec.parentElement!==host){host.appendChild(sec)}"
          if old not in s:
              raise SystemExit('language render block not found')
          s = s.replace(old, new, 1)
          marker = "\n(function(){if(document.getElementById('cvgoInterviewScript'))return;"
          if marker not in s:
              raise SystemExit('script marker not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cvpersist.js
          git diff --cached --quiet && exit 0
          git commit -m "Corregir secciones y layout del CV"
          git push