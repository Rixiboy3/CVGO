name: Fix mobile legal footer
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix footer mobile position'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix footer positioning
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('legal_api.py')
          s=p.read_text(encoding='utf-8')
          old="body{{margin:0;background:#f4f6fa;color:#101828;font-family:Inter,Arial,sans-serif;line-height:1.65}}"
          new="body{{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#f4f6fa;color:#101828;font-family:Inter,Arial,sans-serif;line-height:1.65}}"
          if old not in s: raise SystemExit('body style marker not found')
          s=s.replace(old,new,1)
          oldf="style=\"text-align:center;padding:28px 20px 35px;color:#667085;font-size:12px\""
          newf="style=\"width:100%;margin-top:auto;flex-shrink:0;text-align:center;padding:28px 20px 35px;color:#667085;font-size:12px;box-sizing:border-box\""
          if oldf not in s: raise SystemExit('footer style marker not found')
          s=s.replace(oldf,newf,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add legal_api.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fix footer mobile position'
          git push
          rm -f .github/workflows/fix-mobile-footer.yml
          git add -u .github/workflows/fix-mobile-footer.yml
          git commit -m 'Remove temporary footer workflow'
          git push
