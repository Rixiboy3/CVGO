name: CVGO trial expiry test

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-test-route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add temporary trial expiry route
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.py')
          text = p.read_text(encoding='utf-8')
          marker = "@app.post('/api/logout')"
          route = '''@app.get('/api/test-expire-trial')\ndef test_expire_trial():\n    # Temporary test route: expires only the currently logged-in test account.\n    u = current_user()\n    if not u:\n        return jsonify(ok=False, error='LOGIN_REQUIRED'), 401\n    if os.getenv('CVGO_TEST_MODE', '0') != '1':\n        return jsonify(ok=False, error='TEST_MODE_DISABLED'), 404\n    expired = (now() - timedelta(days=4)).isoformat()\n    db_execute('UPDATE users SET trial_started_at=:trial WHERE id=:id', {'trial': expired, 'id': u['id']})\n    return jsonify(ok=True, trial_expired=True)\n\n\n'''
          if marker not in text:
              raise SystemExit('Marker not found')
          text = text.replace(marker, route + marker, 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit temporary test route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/test-expire-trial.yml
          git commit -m "Add temporary trial expiry test route"
          git push
