name: CVProfit startup check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Import Flask application
        env:
          CVGO_DB: /tmp/cvprofit-ci.db
          CVGO_SESSION_SECRET: ci-test-secret
          COOKIE_SECURE: '0'
        run: python -c "import app; print('CVProfit startup OK:', len(app.app.url_map._rules), 'routes')"
      - name: Production smoke tests
        env:
          CVGO_DB: /tmp/cvprofit-ci-smoke.db
          CVGO_SESSION_SECRET: ci-test-secret
          COOKIE_SECURE: '0'
        run: pytest -q test_production.py
